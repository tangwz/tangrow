<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Tangrow Settings</title>
  <style>
    :root {
      --back: #090a0c;
      --page: #111215;
      --side: #151619;
      --surface: #191a1e;
      --line: #303136;
      --soft-line: #28292e;
      --text: #f0f0f2;
      --sub: #b3b4bd;
      --muted: #95969f;
      --lavender: #c6bcff;
      --green: #99d6b3;
      --amber: #edc58a;
      --red: #ffabab;
      --sans: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --mono: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { min-width: 280px; background: var(--back); }
    body {
      margin: 0; min-height: 100vh; min-height: 100svh; color: var(--text); font: 14px/1.55 var(--sans);
      -webkit-font-smoothing: antialiased; display: grid; place-items: center;
      padding: clamp(18px, 4vh, 48px) clamp(20px, 4.2vw, 76px);
      background: radial-gradient(ellipse at 74% -14%, #1a1b22 0%, transparent 56%), var(--back);
    }
    button, input, select { font: inherit; }
    button, a, input, select { -webkit-tap-highlight-color: transparent; }
    button, select { cursor: pointer; }
    button { color: inherit; background: none; border: 0; }
    button:disabled { cursor: default; opacity: .53; }
    a { color: inherit; }
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible {
      outline: 2px solid var(--lavender); outline-offset: 3px;
    }
    h1, h2, h3, p { margin: 0; }
    .icon { width: 17px; height: 17px; flex: 0 0 auto; display: inline-block; vertical-align: middle; }
    .frame {
      width: min(1200px, 100%); overflow: clip; border: 1px solid #34353c; border-radius: 15px;
      background: var(--page); box-shadow: 0 28px 85px #0008, 0 1px 0 #ffffff08 inset;
    }
    .titlebar {
      height: 43px; display: flex; align-items: center; gap: 17px; padding: 0 17px;
      background: #17181b; border-bottom: 1px solid var(--line);
    }
    .lights { display: inline-flex; align-items: center; gap: 6px; }
    .lights i { width: 9px; height: 9px; border-radius: 50%; background: #a16869; }
    .lights i:nth-child(2) { background: #a38c62; } .lights i:nth-child(3) { background: #6d8e77; }
    .crumbs { display: flex; align-items: center; gap: 9px; color: var(--muted); font-size: 11px; }
    .crumbs b { font-weight: 500; color: #d6d6dc; }
    .crumbs .icon { width: 10px; height: 10px; color: #6d6e78; }
    .crumb-link { padding: 2px 0; color: inherit; font: inherit; }
    .crumb-link:hover { color: var(--text); text-decoration: underline; text-underline-offset: 3px; }
    .chrome-btn {
      margin-left: auto; display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px;
      font-size: 11px; border: 1px solid #38393e; border-radius: 5px; color: #c1c2ca; background: #202125;
    }
    .chrome-btn .icon { width: 13px; height: 13px; }
    .chrome-btn:hover, .secondary:hover, .icon-btn:hover { background: #2a2b31; border-color: #52535d; }
    .mobile-nav { display: none; }
    .workspace { display: grid; grid-template-columns: 221px minmax(0, 1fr); min-height: min(790px, calc(100svh - 110px)); }
    aside { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-width: 0; }
    .brand { display: flex; align-items: center; gap: 10px; padding: 25px 19px 22px; }
    .brand-mark { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 9px; background: #d8d4f3; color: #2e2b41; }
    .brand-mark .icon { width: 23px; height: 23px; }
    .brand-name { font-size: 21px; font-weight: 640; line-height: 1.15; letter-spacing: -1.1px; }
    .version { margin-left: auto; font: 10px/1 var(--mono); color: #a9a9b4; }
    .search-btn {
      margin: 0 13px 8px; min-height: 33px; padding: 0 9px; border: 1px solid #33343a; border-radius: 6px;
      color: var(--muted); background: #1b1c20; display: flex; align-items: center; gap: 8px;
      text-align: start; font-size: 12px;
    }
    .search-btn .icon { width: 14px; height: 14px; }
    .search-btn:hover { border-color: #51525b; color: var(--text); }
    kbd { margin-left: auto; font: 10px/1.1 var(--mono); color: #b2b3be; border: 1px solid #3a3b44; border-radius: 4px; padding: 2px 4px; }
    .side-nav { padding: 0 12px; }
    .nav-group { margin-top: 21px; }
    .group-label { font-size: 11px; font-weight: 550; color: var(--muted); padding: 0 10px; margin-bottom: 6px; }
    .nav-item {
      width: 100%; min-height: 34px; display: flex; align-items: center; gap: 10px; padding: 6px 11px;
      border: 1px solid transparent; border-radius: 6px; color: #b1b2bc; text-align: start; font-size: 13px;
    }
    .nav-item + .nav-item { margin-top: 2px; }
    .nav-item .icon { width: 16px; height: 16px; }
    .nav-item:hover { color: #eeeeef; background: #202126; }
    .nav-item[aria-current="page"] { background: #292831; border-color: #383640; color: #f3f0ff; }
    .nav-item[aria-current="page"] .icon { color: var(--lavender); }
    .side-foot { margin-top: auto; padding: 23px 12px 13px; }
    .profile {
      display: flex; align-items: center; gap: 9px; text-align: start; width: 100%;
      border-top: 1px solid var(--line); padding: 15px 6px 4px; margin-top: 12px;
    }
    .profile strong, .profile small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .profile strong { font-size: 12px; font-weight: 550; color: #d8d8df; }
    .profile small { font-size: 10px; color: var(--muted); }
    .profile .arrow { margin-left: auto; }
    .avatar { width: 31px; height: 31px; flex: 0 0 auto; display: grid; place-items: center; border-radius: 50%; background: #25262d; border: 1px solid #37383f; color: #b9bac6; }
    .truncate { min-width: 0; }
    main { min-width: 0; }
    .content { max-width: 930px; margin: 0 auto; padding: clamp(29px, 3.4vw, 49px) clamp(25px, 4.05vw, 62px) 31px; }
    .page-head { margin-bottom: 23px; }
    h1 { font-size: clamp(27px, 2.45vw, 36px); line-height: 1.24; font-weight: 610; letter-spacing: -.055em; }
    .page-lead { font-size: 13px; line-height: 1.65; color: var(--muted); margin-top: 8px; }
    .pass {
      isolation: isolate; position: relative; overflow: hidden; min-height: 159px; padding: 21px 24px 18px;
      border: 1px solid #3c3b48; border-radius: 10px;
      background: linear-gradient(110deg, #201f27, #1c1b24 53%, #20202c);
    }
    .art { position: absolute; z-index: -1; inset: 0 0 0 auto; width: 47%; height: 100%; pointer-events: none; mask-image: linear-gradient(to right, transparent, #000 13%); }
    .pass-copy { width: 60%; }
    .status { display: inline-flex; align-items: center; gap: 6px; border: 1px solid #46444f; border-radius: 20px; padding: 2px 8px; font-size: 10px; color: #d4d1df; background: #24232d; }
    .status::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: #aaa6bd; }
    .status[data-tone="ok"] { color: #bce8ca; background: #202e27; border-color: #385443; }
    .status[data-tone="ok"]::before { background: var(--green); }
    .status[data-tone="warn"] { color: #e6ccaa; background: #322a21; border-color: #514231; }
    .status[data-tone="warn"]::before { background: var(--amber); }
    .pass h2 { margin-top: 10px; font-size: clamp(22px, 2.13vw, 30px); line-height: 1.25; font-weight: 580; letter-spacing: -.045em; }
    .pass p { font-size: 12px; color: #b5b3c0; margin-top: 5px; }
    .perks { display: flex; flex-wrap: wrap; gap: 6px 15px; margin-top: 16px; font-size: 11px; color: #d2cedf; }
    .perks span { display: inline-flex; align-items: center; gap: 5px; }
    .perks .icon { width: 14px; height: 14px; color: #aba4cb; }
    .sector { margin-top: 26px; }
    .sector-head, .row, .row-start, .button-line { display: flex; align-items: center; }
    .sector-head { justify-content: space-between; gap: 12px; margin-bottom: 11px; }
    .sector-head h2 { font-size: 16px; font-weight: 590; line-height: 1.5; letter-spacing: -.025em; }
    .sector-head .link { font-size: 12px; }
    .link { color: var(--lavender); display: inline-flex; align-items: center; gap: 5px; padding: 3px 0; text-decoration: none; }
    .link:hover { color: #ebe5ff; text-decoration: underline; text-underline-offset: 3px; }
    .link .icon { width: 14px; height: 14px; }
    .form-panel, .row-list { border: 1px solid var(--line); background: #17181c; border-radius: 8px; }
    .form-panel { padding: 17px 19px 15px; }
    label.field-label { display: block; font-size: 12px; font-weight: 540; color: #dcdae3; margin-bottom: 7px; }
    .field { display: flex; flex: 1; min-width: 0; align-items: center; min-height: 38px; gap: 8px; padding: 0 11px; border: 1px solid #3a3b43; border-radius: 6px; background: #101115; color: var(--muted); }
    .field:focus-within { border-color: #a49acf; outline: 2px solid #746da32c; }
    .field .icon { width: 15px; height: 15px; }
    .field input { background: none; width: 100%; min-width: 0; height: 36px; border: 0; outline: 0; color: var(--text); font-size: 13px; }
    .field input:focus-visible { outline: none; }
    input::placeholder { color: #84858e; opacity: 1; }
    .field:has([aria-invalid="true"]) { border-color: var(--red); }
    .input-line { display: flex; gap: 9px; align-items: stretch; }
    .primary, .secondary, .icon-btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid; border-radius: 6px; font-size: 12px; font-weight: 560; white-space: nowrap; }
    .primary { padding: 0 14px; min-height: 37px; color: #151419; background: #ebe9ef; border-color: #f2f0f4; }
    .primary:not(:disabled):hover { background: #fff; }
    .primary .icon, .secondary .icon { width: 14px; height: 14px; }
    .secondary, .icon-btn { min-height: 30px; padding: 3px 10px; color: #e1e0e6; background: #24252a; border-color: #3c3d44; }
    .field-hint, .result { font-size: 11.5px; line-height: 1.65; color: var(--muted); margin-top: 8px; }
    .result { color: var(--lavender); } .result.error { color: var(--red); }
    .mono, .code-input { font-family: var(--mono) !important; }
    .code-input { letter-spacing: .2em; }
    .button-line { justify-content: space-between; flex-wrap: wrap; gap: 8px; }
    .button-line .link { font-size: 11px; }
    .row-list { overflow: hidden; }
    .row { justify-content: space-between; padding: 14px 16px; gap: 14px; }
    .row + .row { border-top: 1px solid var(--soft-line); }
    .row-start { gap: 11px; min-width: 0; }
    .row-icon { width: 32px; height: 32px; display: grid; place-items: center; flex: 0 0 auto; border: 1px solid #36373e; border-radius: 7px; background: #212227; color: #c4c3cf; }
    .row-name { font-size: 13px; font-weight: 540; color: #e4e3ea; overflow-wrap: anywhere; }
    .row-desc { font-size: 11.5px; line-height: 1.55; color: var(--muted); margin-top: 2px; overflow-wrap: anywhere; }
    .row-link { width: 100%; text-align: start; }
    .row-link:hover { background: #1e1f24; }
    .arrow { color: var(--muted); width: 14px; height: 14px; }
    .support-row { min-height: 49px; }
    .support-row .row-icon { width: 26px; height: 26px; border-color: transparent; background: transparent; }
    .support-row .row-start { gap: 14px; }
    .support-row .row-name { color: #c1c1ca; font-size: 12px; }
    .value { font: 11px/1.4 var(--mono); color: var(--sub); text-align: end; }
    .audit { display: flex; align-items: center; gap: 6px; margin-top: 16px; color: var(--muted); font-size: 11px; }
    .audit .icon { width: 13px; height: 13px; }
    .setting-field { min-height: 34px; max-width: min(230px, 44%); padding: 5px 9px; border: 1px solid #3c3d45; border-radius: 5px; color: var(--text); background: #101115; }
    input.setting-field { font: 12px/1.5 var(--mono); width: 210px; }
    input[type="number"].setting-field { width: 74px; }
    select.setting-field { font-size: 12px; }
    .toggle { width: 31px; height: 18px; border-radius: 18px; padding: 2px; border: 1px solid #494a52; background: #34353b; flex: 0 0 auto; }
    .toggle::before { content: ""; display: block; width: 12px; height: 12px; border-radius: 50%; background: #d2d1d9; }
    .toggle[aria-checked="true"] { background: #b4a8eb; border-color: #c7bcf5; }
    .toggle[aria-checked="true"]::before { transform: translateX(12px); background: #302b42; }
    .form-actions { display: flex; justify-content: flex-end; margin-top: 12px; }
    .details { border-top: 1px solid var(--soft-line); padding: 12px 0; }
    .details summary { cursor: pointer; color: var(--text); font-weight: 530; }
    .details p { margin-top: 6px; font-size: 13px; color: var(--sub); }
    dialog { color: var(--text); background: #1b1c20; border: 1px solid #464650; border-radius: 11px; box-shadow: 0 24px 80px #000b; padding: 0; width: min(440px, calc(100% - 28px)); max-height: 86svh; }
    dialog::backdrop { background: #07070baf; }
    .dialog-body { padding: 20px; }
    .dialog-head { display: flex; justify-content: space-between; gap: 14px; align-items: center; margin-bottom: 12px; }
    .dialog-head h2 { font-size: 17px; letter-spacing: -.03em; }
    .icon-btn { width: 29px; height: 29px; min-height: 29px; padding: 0; }
    .icon-btn .icon { width: 15px; height: 15px; }
    .dialog-copy { font-size: 12px; color: var(--sub); line-height: 1.7; }
    .dialog-body .field { margin: 8px 0 10px; }
    .menu-list { display: grid; gap: 2px; margin: 9px 0; }
    .menu-item { display: flex; gap: 9px; align-items: center; padding: 8px 10px; width: 100%; text-align: start; border-radius: 5px; color: var(--sub); }
    .menu-item:hover, .menu-item:focus-visible, .menu-item[aria-current="true"] { background: #303039; color: var(--text); }
    .menu-item .trail { margin-left: auto; }
    .dialog-foot { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 12px; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
    .toast { position: fixed; z-index: 5; bottom: 20px; left: 50%; transform: translateX(-50%); background: #303037; color: var(--text); border: 1px solid #55535e; border-radius: 7px; padding: 7px 14px; max-width: calc(100% - 24px); font-size: 12px; box-shadow: 0 6px 22px #0007; }
    @media (min-width: 1450px) { .workspace { min-height: 790px; } }
    @media (max-width: 950px) {
      body { padding: 16px; } .workspace { grid-template-columns: 190px minmax(0, 1fr); }
      .brand { padding-inline: 15px; } .content { padding: 32px 27px 28px; }
    }
    @media (max-width: 700px) {
      body { display: block; padding: 0; background: var(--page); }
      .frame { width: 100%; min-height: 100svh; border: 0; border-radius: 0; }
      .titlebar { position: sticky; z-index: 2; top: 0; height: 46px; gap: 10px; padding: 0 15px; }
      .lights, aside { display: none; }
      .mobile-nav { display: inline-flex; align-items: center; gap: 5px; color: var(--sub); padding: 5px 4px 5px 0; font-size: 12px; }
      .mobile-nav .icon { width: 17px; height: 17px; }
      .crumbs { border-left: 1px solid var(--line); padding-left: 10px; }
      .crumbs > :not(b) { display: none; }
      .workspace { display: block; min-height: 0; }
      .content { max-width: 560px; padding: 27px clamp(17px, 4vw, 26px) 32px; }
      .page-head { margin-bottom: 20px; } .pass { padding: 17px 16px; min-height: 151px; }
      .pass-copy { width: 68%; } .art { width: 43%; } .pass h2 { font-size: 23px; }
      .perks { gap: 5px 9px; } .sector { margin-top: 21px; }
      .form-panel { padding: 14px; } .row { padding: 12px; gap: 8px; }
      .input-line .primary, .field input, .row .secondary, .menu-item { min-height: 42px; }
      .field input, input.setting-field, select.setting-field { font-size: 16px; }
      .sector-head .link, .button-line .link { min-height: 32px; }
    }
    @media (max-width: 410px) {
      .pass-copy { width: 76%; } .art { width: 38%; opacity: .86; } .perks { font-size: 10px; }
      .input-line { flex-wrap: wrap; } .input-line .field { flex: 1 1 146px; } .primary { padding-inline: 10px; }
      .row-icon { width: 28px; height: 28px; } .row-start { gap: 8px; }
      .settings-form .row { flex-wrap: wrap; }
      .settings-form input.setting-field:not([type="number"]) { width: 100%; max-width: 100%; }
    }
    @media (max-width: 340px) { .art { opacity: .4; } .pass-copy { width: 90%; } .input-line .primary { width: 100%; } }
    .frame[data-view="entry"] .workspace { display: block; }
    h1[tabindex="-1"]:focus { outline: none; }
    .frame[data-view="entry"] aside, .frame[data-view="entry"] .mobile-nav { display: none; }
    .frame[data-view="entry"] .content { max-width: 850px; padding-top: 35px; }
    .entry-head { display: flex; justify-content: space-between; gap: 16px; align-items: center; margin-bottom: 20px; }
    .entry-brand { display: flex; gap: 14px; align-items: center; }
    .entry-brand .brand-mark { width: 44px; height: 44px; border-radius: 11px; }
    .entry-brand .brand-mark .icon { width: 29px; height: 29px; }
    .entry-head .page-lead { margin-top: 2px; }
    .entry-group { margin-top: 17px; }
    .entry-group h2 { margin-bottom: 6px; font-size: 12px; font-weight: 550; color: var(--sub); }
    .entry-line { min-height: 48px; padding-block: 8px; text-decoration: none; }
    .entry-line .row-icon { width: 28px; height: 28px; }
    .entry-line .row-desc { margin-top: 0; }
    .account-state { width: 8px; height: 8px; border-radius: 50%; background: #a59fae; box-shadow: 0 0 0 3px #a59fae17; }
    .account-state[data-tone="ok"] { background: var(--green); box-shadow: 0 0 0 3px #99d6b313; }
    .account-state[data-tone="warn"] { background: var(--amber); box-shadow: 0 0 0 3px #edc58a15; }
    .status-nav { gap: 13px; min-height: 44px; }
    .status-nav .truncate { display: grid; }
    .status-nav strong { font-size: 13px; font-weight: 540; }
    .status-nav small { color: var(--muted); font-size: 10px; }
    a.nav-item { text-decoration: none; }
    .nav-item > .arrow { margin-left: auto; width: 12px; height: 12px; color: var(--muted); }
    .side-foot .nav-item { border-top: 1px solid var(--line); border-radius: 0; padding-top: 12px; min-height: 40px; }
    .setting-search { position: relative; margin: 0 13px 4px; }
    .setting-search .field { min-height: 33px; padding-inline: 8px; gap: 6px; background: #1b1c20; }
    .setting-search .field input { height: 31px; font-size: 12px; }
    .setting-search kbd { white-space: nowrap; }
    .search-menu { position: absolute; z-index: 4; top: calc(100% + 5px); left: 0; width: min(340px, 80vw); max-height: min(420px, 55vh); overflow-y: auto; padding: 5px; border: 1px solid #46464e; border-radius: 7px; background: #202125; box-shadow: 0 10px 26px #0008; }
    .search-match { display: flex; align-items: center; gap: 7px; width: 100%; padding: 8px 9px; text-align: start; color: var(--text); border-radius: 4px; font-size: 12px; }
    .search-match .context { color: var(--muted); font-size: 11px; }
    .search-match .icon { width: 10px; height: 10px; color: var(--muted); }
    .search-match:hover, .search-match:focus-visible { background: #33333d; }
    .search-menu p { padding: 7px 8px; }
    .mobile-search { display: none; } .page-lead { text-wrap: pretty; }
    .zone { margin-top: 12px; border: 1px solid var(--line); border-radius: 8px; background: #17181c; }
    .zone > summary { padding: 14px 16px; display: flex; align-items: center; gap: 9px; list-style: none; cursor: pointer; min-height: 48px; }
    .zone > summary::-webkit-details-marker { display: none; }
    .zone > summary > .icon:first-child { color: #b6b1cb; width: 16px; height: 16px; }
    .zone > summary strong { font-size: 14px; font-weight: 550; }
    .zone-value { margin-left: auto; font-size: 11px; color: var(--muted); text-align: end; }
    .zone > summary > .arrow { width: 12px; height: 12px; }
    .zone[open] > summary > .arrow { transform: rotate(90deg); }
    .zone[open] > summary { border-bottom: 1px solid var(--soft-line); }
    .zone-body { padding: 2px 15px 9px; }
    .zone-body .row-list, .zone-body .form-panel { border: 0; border-radius: 0; background: transparent; }
    .zone-body .row { padding-inline: 1px; }
    .zone-body .form-panel { padding: 8px 0 5px; }
    .zone-tools { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 34px; color: var(--muted); font-size: 12px; }
    .zone-tools .link { font-size: 12px; }
    .pass + .zone { margin-top: 21px; }
    .located { outline: 2px solid var(--lavender) !important; outline-offset: 2px; border-radius: 4px; }
    .settings-form textarea.setting-field { font: 12px/1.5 var(--mono); resize: vertical; width: 210px; min-height: 56px; }
    .settings-form .form-actions { margin-top: 14px; }
    @media (max-width: 700px) {
      .frame[data-view="entry"] .content { padding-top: 24px; }
      .frame[data-view="entry"] .crumbs { border: 0; padding-left: 0; }
      .frame[data-view="entry"] .crumbs > :first-child, .frame[data-view="entry"] .crumbs > :nth-child(2) { display: inline-block; }
      .entry-head { align-items: flex-start; flex-wrap: wrap; gap: 12px; }
      .mobile-search { display: block; margin: 12px 0 0; }
      .mobile-search .field input { font-size: 16px; }
      .search-menu { width: 100%; max-height: 45svh; }
      .search-match { min-height: 42px; }

        else pages.filter(p => p.group===group).forEach(p => g.append(navItem(p)));
        nav.append(g);
      }
      const footer=element("div","side-foot"); footer.append(button("Back to plugin settings","entry","nav-item","menu"));
      aside.append(brand,searchBox(),nav,footer);
      const crumb = demo.page === "entry" ? element("span","",t("Community plugins")) : button("Plugin settings","entry","crumb-link");
      $("#crumbs").replaceChildren(element("span","","Obsidian"),icon("chevron"),crumb,icon("chevron"),element("b","","Tangrow"));
      $(".mobile-nav").replaceChildren(icon("chevron"),document.createTextNode(t("Back to settings")));
      $(".mobile-nav").firstChild.style.transform="rotate(180deg)";
      $(".chrome-btn").replaceChildren(icon("switcher"),document.createTextNode(t("Preview states")),icon("down"));
    }
    function entryPage() {
      const head=element("header","entry-head"), brand=element("div","entry-brand"), mark=element("span","brand-mark"), copy=element("div");
      mark.append(icon("sprout")); const title=element("h1","","Tangrow"); title.tabIndex=-1;
      copy.append(title,element("p","page-lead",t("Choose a section to open it in the settings window.")));
      brand.append(mark,copy); head.append(brand,button("Open settings window","page-general","primary","","arrow")); content.append(head);
      for (const name of navGroups) {
        const block=element("section","entry-group"), list=element("div","row-list");
        block.append(element("h2","",t(name)),list); content.append(block);
        if (name==="Account & help") {
          const b=button("","page-account","row row-link entry-line");
          const statusRow=rowHead("user",t(status()[0]),t("Email sign-in, device access and plugin updates")+" \u00b7 v"+version);
          statusRow.firstChild.replaceChildren(statusDot());
          b.append(statusRow,icon("chevron","arrow")); list.append(b,docsLink(true));
        } else for (const page of pages.filter(p=>p.group===name)) {
          const b=button("","page-"+page.id,"row row-link entry-line");
          b.append(rowHead(page.icon,t(page.title),t(page.lead)),icon("chevron","arrow")); list.append(b);
        }
      }
    }
    function render() {
      if (artObserver) artObserver.disconnect();
      document.documentElement.lang = prefs.lang; document.title = "Tangrow \u00b7 " + t("Plugin settings");
      $(".frame").dataset.view=demo.page==="entry" ? "entry" : "settings";
      renderNav(); content.replaceChildren();
      if (demo.page==="entry") { entryPage(); tick(); return; }
      const page = pageById.get(demo.page);
      const header = element("header","page-head"), title = element("h1","",t(page.title)); title.tabIndex = -1;
      header.append(title,element("p","page-lead",t(page.lead)),searchBox(true)); content.append(header);
      if (page.id === "account") accountPage(); else if (page.id === "help") helpPage(); else preferences(page.id);
      tick();
    }
    function toast(text) {
      clearTimeout(noticeTimer); const node = $("#notice"); node.textContent = text; node.hidden = false;
      noticeTimer = setTimeout(() => { node.hidden = true; }, 3600);
    }
    function navigate(id, focus = true, writeHash = true) {
      if (dialog.open) dialog.close();
      if (id !== "entry" && !pageById.has(id)) return;
      scrollOffsets.set(demo.page,window.scrollY);
      for (const details of content.querySelectorAll(".zone")) openZones.set(demo.page+"/"+details.id.slice(5),details.open);
      demo.page = id; render();
      if (writeHash && location.hash !== "#"+id) {
        try { history.pushState(null,"","#"+id); } catch { location.hash=id; }
      }
      if (focus) content.querySelector("h1").focus({preventScroll:true});
      window.scrollTo(0,scrollOffsets.get(id) || 0);
    }
    const samples = [
      ["fresh", "First visit", "user"], ["trial", "Trial in progress", "timer"], ["expired", "Trial ended", "clock"],
      ["pending", "Email verified, order pending", "mail"], ["active", "Lifetime access", "shield"]
    ];
    function openDialog(title) {
      const body = $("#dialogBody"); body.replaceChildren();
      const head = element("div","dialog-head"), h = element("h2","",t(title)); h.id = "dialogTitle";
      const close = button("", "close", "icon-btn", "x"); close.setAttribute("aria-label", t("Close"));
      head.append(h, close); body.append(head);
      if (!dialog.open) dialog.showModal();
      return body;
    }
    function searchEntries() {
      const entries = [];
      function add(page,target,label,aliases=[]) { entries.push({page,target,label,aliases}); }
      for (const [page,groups] of Object.entries(prefGroups)) {
        for (const group of groups) {
          add(page,"zone-"+group.id,group.title);
          for (const field of group.fields) {
            const aliases = [group.title];
            if (field.key === "focus") aliases.push("Pomodoro","Focus timer");
            if (field.key === "lang") aliases.push("English","Simplified Chinese");
            if (field.key === "key") aliases.push("Anthropic");
            add(page,"pref-"+field.key,field.label,aliases);
          }
        }
      }
      add("account","zone-auth","Account & device");
      const loginControl=demo.email ? "Login account" : demo.requested ? "Email verification code" : "Purchase email";
      add("account","identity",loginControl,["Email sign-in","Sign in to account","Email verification code"]);
      add("account","release-link","Plugin updates",["Version","GitHub Releases","View releases"]);
      if (demo.email) add("account","refresh","Refresh access");
      if (demo.active) add("account","zone-access","Device access",["Offline use"]);
      else {
        add("account","redeem","Redemption code",["I have a redemption code"]);
        add("account","trial","24-hour free trial",["Start trial"]);
      }
      questions.forEach(([q],i)=>add("help","faq-"+i,q));
      return entries;
    }
    function updateSearch(input) {
      const list = input.closest(".setting-search").querySelector(".search-menu");
      const query = input.value.trim().toLocaleLowerCase(); list.replaceChildren(); list.hidden=!query;
      if (!query) return;
      const tokens=query.split(/\s+/);
      const ranked=searchEntries().map(hit=>{
        const sectionName=pageById.get(hit.page).title;
        const label=t(hit.label).toLocaleLowerCase();
        const all=[hit.label,sectionName,t(sectionName),label,...hit.aliases.flatMap(a=>[a,t(a)])].join(" ").toLocaleLowerCase();
        const score=label===query ? 0 : label.includes(query) ? 1 : 2;
        return {hit,score,matches:tokens.every(token=>all.includes(token))};
      }).filter(r=>r.matches).sort((a,b)=>a.score-b.score).slice(0,20);
      for (const {hit} of ranked) {
        const b=button("","find-setting","search-match");
        b.dataset.page=hit.page; b.dataset.target=hit.target;
        b.append(element("span","context",t(pageById.get(hit.page).title)),icon("chevron"),element("span","",t(hit.label)));
        list.append(b);
      }
      if (!ranked.length) list.append(element("p","dialog-copy",t("No matching settings.")));
    }
    function findSetting(page, targetId) {
      if (targetId==="redeem" && !demo.active) demo.redeem=true;
      if (targetId==="refresh") demo.redeem=false;
      navigate(page,false);
      let target;
      switch (targetId) {
        case "redeem": target=content.querySelector("#cardValue,#emailValue,#otpValue") || $("#zone-auth"); break;
        case "identity": target=content.querySelector("#verified-email,#emailValue,#otpValue"); break;
        case "refresh": target=content.querySelector('[data-action="refresh"]'); break;
        case "trial": target=content.querySelector('[data-action="start-trial"],#remaining') || $("#zone-access"); break;
        default: target=document.getElementById(targetId);
      }
      if (!target) return;
      const details=target.closest("details");
      if (details) {
        details.open=true;
        if (details.classList.contains("zone")) openZones.set(page+"/"+details.id.slice(5),true);
      }
      const point=target.matches("details") ? target.querySelector("summary") : target.closest("[data-field]") || target;
      if (!point.hasAttribute("tabindex") && !point.matches("input,button,summary,a")) point.tabIndex=-1;
      point.focus({preventScroll:true}); point.scrollIntoView({block:"center"});
      point.classList.add("located"); clearTimeout(highlightTimer);
      highlightTimer=setTimeout(()=>point.classList.remove("located"),1800);
    }
    function previewDialog() {
      const body = openDialog("Preview states");
      body.append(element("p","dialog-copy",t("This local prototype simulates verification and orders. No email is sent.")));
      const list = element("div","menu-list");
      const current = demo.active ? "active" : demo.email ? "pending" : ({idle:"fresh",running:"trial",expired:"expired"})[trialState()];
      for (const [id,label,symbol] of samples) {
        const b = button(label,"sample-"+id,"menu-item",symbol);
        if (id === current) { b.setAttribute("aria-current","true"); b.append(icon("check","trail")); }
        list.append(b);
      }
      const foot = element("div","dialog-foot");
      foot.append(element("p","dialog-copy",t("Try {email} with code {code} for a paid order. Other emails start without a purchase.", { email: sampleEmail, code: sampleCode })));
      if (demo.email === pendingEmail && !demo.active && !demo.paid.has(pendingEmail)) foot.append(button("Simulate order sync","sync-order","link","sync"));
      body.append(list,foot);
    }
    function simpleDialog(kind) {
      const logout = kind === "logout";
      const info={
        logout:["Sign out on this device?","To restore purchased access here, you will need to verify your email online. Your original trial period is kept."],
        "key-info":["API key","Set your Anthropic key in the installed plugin. This design preview uses sample settings only."],
        "bases-info":["Set up companion Bases","In the plugin this creates missing views in your companion folder and keeps existing views and notes."],
        "migrate-info":["Move companion folder","The plugin checks that 99-Tangrow is available before moving files. This preview only shows the operation."],
        "guide-info":["Agent guide","The plugin opens AGENTS.md in the companion folder or creates the guide if it is missing."]
      }[kind];
      const body = openDialog(info[0]); body.append(element("p","dialog-copy",t(info[1])));
      const actions = element("div","dialog-actions");
      actions.append(button(logout ? "Cancel" : "Done","close","secondary"));
      if (logout) actions.append(button("Sign out","confirm-logout","primary"));
      body.append(actions);
    }
    function clearLogin() {
      Object.assign(demo,{email:"",draft:"",requested:"",resendAt:0,codeUntil:0,redeem:false,active:false,checkedAt:0});
    }
    function sample(id) {
      clearLogin(); demo.paid = new Set([sampleEmail]); demo.cardOwner = "";
      setTrial(id === "trial" ? Date.now()-5*60*60*1000 : id === "expired" ? Date.now()-day-60000 : 0);
      if (id === "active") { demo.email = sampleEmail; demo.active = true; demo.checkedAt = Date.now(); }
      if (id === "pending") demo.email = pendingEmail;
      saveSession();
      navigate("account");
    }
    function issueCode(email) {
      demo.draft = email; demo.requested = email; demo.codeUntil = Date.now()+600000; demo.resendAt = Date.now()+60000;
    }
    function applyEntitlement() {
      demo.active = Boolean(demo.email && (demo.paid.has(demo.email) || demo.cardOwner === demo.email));
      if (demo.active) { demo.checkedAt = Date.now(); demo.redeem = false; }
      saveSession();
    }
    function submitAccount(form) {
      if (form.elements.emailValue) {
        const input = form.elements.emailValue;
        const email = input.value.trim().toLowerCase(); input.value = email;
        if (!email || !input.validity.valid || !email.includes("@")) { formMessage("Enter a valid email address.",true); return; }
        issueCode(email); render(); $("#otpValue").focus(); return;
      }
      if (form.elements.otpValue) {
        if (Date.now() >= demo.codeUntil) { formMessage("The code has expired. Request another code.",true); return; }
        if (form.elements.otpValue.value.trim() !== sampleCode) { formMessage("Incorrect code. Check the six-digit demo code below the field.",true); return; }
        demo.email = demo.requested; demo.requested = ""; demo.resendAt = 0; demo.codeUntil = 0;
        applyEntitlement(); render();
        if ($("#cardValue")) $("#cardValue").focus();
        toast(t(demo.active ? "Purchase restored on this device." : "Email verified.")); return;
      }
      if (form.elements.cardValue) {
        const value = form.elements.cardValue.value.trim().toUpperCase();
        if (value !== sampleCard) { formMessage("Check the demo redemption code and try again.",true); return; }
        if (demo.cardOwner && demo.cardOwner !== demo.email) { formMessage("This code is already bound to another email.",true); return; }
        demo.cardOwner = demo.email; applyEntitlement(); render(); toast(t("Purchase restored on this device."));
      }
    }
    function submitPrefs(form) {
      if (!accessAllowed()) return;
      const edits = Object.fromEntries(new FormData(form));
      for (const key of Object.keys(edits)) {
        let value = edits[key].trim();
        const kind=fieldByKey.get(key)?.kind;
        if (kind === "number") {
          const maximum=key==="dailyGoal" ? 1440 : 240;
          value = Number(value);
          if (!Number.isInteger(value) || value < 1 || value > maximum) { toast(t("Enter a whole number from 1 to {n}.",{n:maximum})); return; }
        } else if (kind === "list") {
          const paths=[...new Set(value.split(/\r?\n/).map(item=>item.trim()).filter(Boolean))];
          if (paths.length>100 || paths.some(path=>path.startsWith("/") || path.split("/").some(part=>!part || part.startsWith(".")))) { toast(t("Use up to 100 relative folder paths.")); return; }
          value=paths.join("\n");
        } else if ((!value && kind !== "optional") || value.startsWith("/") || value.split("/").includes("..")) {
          toast(t("Enter a path or format relative to the vault.")); return;
        }
        edits[key] = value;
      }
      Object.assign(prefs,edits); render(); toast(t("Saved in this preview."));
    }
    function accountFocus() {
      findSetting("account","zone-auth");
      const target = $("#accountForm input") || $("#zone-auth [data-action='refresh']") || $("#zone-auth summary");
      target.focus();
    }
    function handleAction(action, source) {
      if (action.startsWith("page-")) { navigate(action.slice(5)); return; }
      if (action.startsWith("sample-")) { sample(action.slice(7)); return; }
      switch (action) {
        case "entry": navigate("entry"); break;
        case "find-setting": findSetting(source.dataset.page,source.dataset.target); break;
        case "preview": previewDialog(); break;
        case "close": dialog.close(); break;
        case "go-help": navigate("help"); break;
        case "go-account": case "account-focus": accountFocus(); break;
        case "key-info": case "bases-info": case "migrate-info": case "guide-info": case "logout": simpleDialog(action); break;
        case "confirm-logout": clearLogin(); saveSession(); navigate("account"); toast(t("Signed out on this device.")); break;
        case "start-trial":
          if (!demo.trialStart && !demo.active) setTrial(Date.now());
          render(); toast(t("Your 24-hour trial has started.")); break;
        case "toggle-redeem":
          demo.redeem = !demo.redeem; render(); content.querySelector("form input")?.focus(); break;
        case "change-email": demo.requested = ""; render(); $("#emailValue")?.focus(); break;
        case "resend":
          if (demo.requested && Date.now() >= demo.resendAt) { issueCode(demo.requested); render(); $("#otpValue").focus(); toast(t("New demo code available.")); }
          break;
        case "refresh":
          applyEntitlement(); render();
          toast(t(demo.active ? "Access is up to date." : "No matching purchase yet. Check your email or wait for order sync.")); break;
        case "sync-order":
          if (demo.email === pendingEmail) { demo.paid.add(pendingEmail); saveSession(); dialog.close(); toast(t("Sample order synced. Choose Refresh access.")); }
          break;
        case "toggle-pref":
          if (accessAllowed()) {
            prefs[source.dataset.pref] = !prefs[source.dataset.pref]; source.setAttribute("aria-checked",String(prefs[source.dataset.pref]));
            const details=source.closest(".zone"), group=prefGroups[demo.page].find(item=>"zone-"+item.id===details.id);
            details.querySelector(".zone-value").textContent=groupSummary(group); toast(t("Saved in this preview."));
          }
          break;
      }
    }
    let renderedTrial = "";
    function tick() {
      const state = trialState();
      const resend = $("#resend");
      if (resend) {
        const seconds = Math.max(0,Math.ceil((demo.resendAt-Date.now())/1000));
        resend.disabled = seconds > 0; resend.textContent = seconds ? t("Resend in {n}s",{n:seconds}) : t("Resend code");
      }
      const remaining = $("#remaining");
      if (remaining) {
        const minutes = Math.max(0,Math.ceil((demo.trialStart+day-Date.now())/60000));
        remaining.textContent = t("{h}h {m}m left",{h:Math.floor(minutes/60),m:minutes%60});
      }
      const expiredNow = renderedTrial === "running" && state === "expired"; renderedTrial = state;
      if (expiredNow && !demo.active) render();
    }
    document.addEventListener("click", event => {
      if (!event.target.closest(".setting-search")) document.querySelectorAll(".search-menu").forEach(menu=>{menu.hidden=true;});
      const source = event.target.closest("[data-action]");
      if (source && !source.disabled && source.dataset.action) handleAction(source.dataset.action,source);
    });
    dialog.addEventListener("click",event => { if (event.target === dialog) dialog.close(); });
    document.addEventListener("input",event => {
      if (event.target.matches("[data-search]")) updateSearch(event.target);
      if (event.target.id === "emailValue") demo.draft = event.target.value;
      if (event.target.closest("#accountForm")) { event.target.removeAttribute("aria-invalid"); const msg = $("#formMessage"); if (msg) msg.hidden = true; }
    });
    document.addEventListener("change",event => {
      const key = event.target.dataset.select;
      if (key === "lang" || (key === "model" && accessAllowed())) {
        prefs[key] = event.target.value; render(); $("#pref-"+key)?.focus(); toast(t("Saved in this preview."));
      }
    });
    document.addEventListener("submit",event => {
      event.preventDefault();
      if (event.target.id === "accountForm") submitAccount(event.target);
      if (event.target.matches(".settings-form")) submitPrefs(event.target);
    });
    document.addEventListener("focusin",event=>{
      document.querySelectorAll(".setting-search").forEach(box=>{
        if (!box.contains(event.target)) box.querySelector(".search-menu").hidden=true;
      });
      if (event.target.matches("[data-search]") && event.target.value) updateSearch(event.target);
    });
    document.addEventListener("keydown",event => {
      if (dialog.open || event.isComposing) return;
      if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase()==="k") {
        event.preventDefault(); if (demo.page==="entry") navigate("general",false);
        const selector=matchMedia("(max-width: 700px)").matches ? ".mobile-search" : ".desktop-search";
        const input=document.querySelector(selector+" input"); input.focus(); input.select(); return;
      }
      const box=event.target.closest(".setting-search");
      const input=box?.querySelector("input");
      if (event.key==="Escape") {
        if (input?.value) { input.value=""; updateSearch(input); input.focus(); }
        else if (demo.page!=="entry") navigate("entry");
        event.preventDefault(); return;
      }
      if (!box || box.querySelector(".search-menu").hidden) return;
      const items = Array.from(box.querySelectorAll(".search-match"));
      if (!items.length) return;
      if (event.key === "Enter" && document.activeElement === input) { event.preventDefault(); items[0].click(); }
      if (event.key === "ArrowDown" || event.key === "ArrowUp") {
        event.preventDefault(); const index = items.indexOf(document.activeElement);
        const next = index === -1 ? (event.key === "ArrowDown" ? 0 : items.length-1) : (index + (event.key === "ArrowDown" ? 1 : -1) + items.length) % items.length;
        items[next].focus();
      }
    });
    function routeFromHash() {
      const requested=location.hash.slice(1);
      return pageById.has(requested) ? requested : "entry";
    }
    window.addEventListener("hashchange",()=>{const id=routeFromHash(); if(id!==demo.page) navigate(id,true,false);});
    demo.page=routeFromHash(); render(); setInterval(tick,1000);
  </script>
</body>
</html>
