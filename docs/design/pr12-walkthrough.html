  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch {}
    return { checked: {}, notes: {} };
  }

  const saved = loadState();
  const state = {
    tab: 'overview',
    loopId: 'organize',
    pipeId: 'context',
    taskFilter: 'all',
    scenarioId: 'toctou',
    taskTab: 'wiki-compile',
    clauseQuery: '',
    clauseDoc: 'all',
    checked: saved.checked || {},
    notes: saved.notes || {}
  };

  function persist() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ checked: state.checked, notes: state.notes })); } catch {}
  }

  function esc(str) {
    return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.style.opacity = '1';
    clearTimeout(toast._t);
    toast._t = setTimeout(() => { el.style.opacity = '0'; }, 2400);
  }

  function updateProgress() {
    const total = DATA.checklist.length;
    const done = DATA.checklist.filter(i => state.checked[i.id]).length;
    document.getElementById('progress-label').textContent = `${done} / ${total}`;
    document.getElementById('progress-bar').style.width = `${Math.round((done / total) * 100)}%`;
  }

  function setTab(tab) {
    state.tab = tab;
    document.querySelectorAll('#main-tabs [role="tab"]').forEach(btn => {
      btn.setAttribute('aria-selected', btn.getAttribute('data-tab') === tab ? 'true' : 'false');
    });
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  }

  function renderClauseRows(list) {
    if (!list.length) {
      return '<tr><td colspan="4" class="py-6 text-center text-[var(--muted-foreground)]">没有匹配的条款，请更换关键词。</td></tr>';
    }
    return list.map(c => `
      <tr>
        <td class="py-2.5 pr-3 align-top whitespace-nowrap">
          <div class="font-mono text-[var(--code-foreground)]">${esc(c.doc)}</div>
          <div class="text-[var(--muted-foreground)]">${esc(c.sec)}</div>
        </td>
        <td class="py-2.5 pr-3 align-top leading-relaxed">
          <div class="font-semibold text-[var(--foreground)]">${esc(c.title)}</div>
          <div class="text-[var(--muted-foreground)] mt-0.5">${esc(c.summary)}</div>
        </td>
        <td class="py-2.5 pr-3 align-top text-[var(--muted-foreground)] leading-relaxed">${esc(c.why)}</td>
        <td class="py-2.5 align-top whitespace-nowrap">
          <button type="button" data-jump="${c.tab}" class="text-xs px-2 py-1 rounded-lg border border-[var(--border)] hover:border-[var(--primary)] text-[var(--link)] cursor-pointer">查看 →</button>
        </td>
      </tr>
    `).join('');
  }

  function updateClauseTable() {
    const tbody = document.getElementById('clause-tbody');
    const countEl = document.getElementById('clause-count');
    if (!tbody || !countEl) return;
    const q = state.clauseQuery.trim().toLowerCase();
    const list = DATA.clauseIndex.filter(c => {
      if (state.clauseDoc !== 'all' && c.doc !== state.clauseDoc) return false;
      if (!q) return true;
      return `${c.doc} ${c.sec} ${c.title} ${c.summary} ${c.why}`.toLowerCase().includes(q);
    });
    tbody.innerHTML = renderClauseRows(list);
    countEl.textContent = `${list.length} / ${DATA.clauseIndex.length}`;
    tbody.querySelectorAll('[data-jump]').forEach(btn => {
      btn.addEventListener('click', () => setTab(btn.getAttribute('data-jump')));
    });
  }

  function render() {
    const host = document.getElementById('panel-host');
    const views = {
      overview: renderOverview,
      loop: renderLoop,
      engine: renderEngine,
      recovery: renderRecovery,
      tasks: renderTasks,
      ops: renderOps,
      copy: renderCopy
    };
    host.innerHTML = (views[state.tab] || renderOverview)();
    bindPanelEvents();
    updateProgress();
  }

  function bindPanelEvents() {
    document.querySelectorAll('[data-loop]').forEach(el => {
      const go = () => { state.loopId = el.getAttribute('data-loop'); render(); };
      el.addEventListener('click', go);
      el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
    });
    document.querySelectorAll('[data-pipe]').forEach(el => {
      const go = () => { state.pipeId = el.getAttribute('data-pipe'); render(); };
      el.addEventListener('click', go);
      el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
    });
    document.querySelectorAll('[data-tfilter]').forEach(btn => {
      btn.addEventListener('click', () => { state.taskFilter = btn.getAttribute('data-tfilter'); render(); });
    });
    document.querySelectorAll('[data-scenario]').forEach(btn => {
      btn.addEventListener('click', () => { state.scenarioId = btn.getAttribute('data-scenario'); render(); });
    });
    document.querySelectorAll('[data-tasktab]').forEach(btn => {
      btn.addEventListener('click', () => { state.taskTab = btn.getAttribute('data-tasktab'); render(); });
    });
    document.querySelectorAll('[data-jump]').forEach(btn => {
      btn.addEventListener('click', () => setTab(btn.getAttribute('data-jump')));
    });
    document.querySelectorAll('[data-check]').forEach(box => {
      box.addEventListener('change', () => {
        state.checked[box.getAttribute('data-check')] = box.checked;
        persist();
        render();
      });
    });
    document.querySelectorAll('[data-note]').forEach(input => {
      input.addEventListener('input', () => {
        state.notes[input.getAttribute('data-note')] = input.value;
        persist();
      });
    });
    const checkAll = document.getElementById('btn-check-all');
    if (checkAll) {
      checkAll.addEventListener('click', () => {
        const allDone = DATA.checklist.every(i => state.checked[i.id]);
        DATA.checklist.forEach(i => { state.checked[i.id] = !allDone; });
        persist();
        render();
      });
    }
    const searchInput = document.getElementById('clause-search');
    if (searchInput) {
      searchInput.addEventListener('input', () => {
        state.clauseQuery = searchInput.value;
        updateClauseTable();
      });
    }
    const docSelect = document.getElementById('clause-doc');
    if (docSelect) {
      docSelect.addEventListener('change', () => {
        state.clauseDoc = docSelect.value;
        updateClauseTable();
      });
    }
  }

  document.querySelectorAll('#main-tabs [role="tab"]').forEach(btn => {
    btn.addEventListener('click', () => setTab(btn.getAttribute('data-tab')));
  });

  document.getElementById('btn-export').addEventListener('click', async () => {
    const lines = [
      '## PR #12 全条款人工走读确认记录（HEAD `08d7c09`）',
      '',
      ...DATA.checklist.map(i => {
        const mark = state.checked[i.id] ? 'x' : ' ';
        const note = (state.notes[i.id] || '').trim();
        return `- [${mark}] [${i.cat}] ${i.text}${note ? ` —— 备注：${note}` : ''}`;
      })
    ].join('\n');
    try {
      await navigator.clipboard.writeText(lines);
      toast('已复制 Markdown 审核记录到剪贴板');
    } catch {
      toast('剪贴板不可用，请手动复制');
    }
  });

  document.getElementById('btn-reset').addEventListener('click', () => {
    state.checked = {};
    state.notes = {};
    persist();
    render();
    toast('已重置勾选与备注');
  });

  const THEME_KEY = "tangrow.pr12.walkthrough.theme";
  function applyTheme(theme) {
    const isLight = theme === "light";
    if (isLight) {
      document.documentElement.setAttribute("data-theme", "light");
    } else {
      document.documentElement.removeAttribute("data-theme");
    }
    const btn = document.getElementById("btn-theme");
    if (btn) btn.textContent = isLight ? "深色模式" : "浅色模式";
  }
  const savedTheme = (() => { try { return localStorage.getItem(THEME_KEY); } catch { return null; } })();
  applyTheme(savedTheme === "light" ? "light" : "dark");
  const themeBtn = document.getElementById("btn-theme");
  if (themeBtn) {
    themeBtn.addEventListener("click", () => {
      const next = document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light";
      applyTheme(next);
      try { localStorage.setItem(THEME_KEY, next); } catch {}
    });
  }

  render();
})();
</script>
</body>
</html>
